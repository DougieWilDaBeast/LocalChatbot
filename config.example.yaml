# Copy this file to config.yaml and customize values for your environment.
# Example:
#   cp config.example.yaml config.yaml

# =============================================================================
# NUC Offline Voice Assistant — Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Assistant Identity
# -----------------------------------------------------------------------------
assistant:
  name: "Jarvis"                        # Shown at startup. Also change it in system_prompt below,
                                        # and pick a matching wake_word.model
  # Everything in system_prompt is sent to the model as-is, so anything left in
  # it, including placeholder text, can end up being spoken. To personalise it,
  # add a line at the end such as:
  #   The person you are speaking with is Sam, based in Leeds. They are retired
  #   and interested in local history and the weather.
  system_prompt: |
    You are a friendly, patient voice assistant called Jarvis.
    You are running locally on a small computer in the home.
    You have no internet connection and do not need one.
    Keep your responses conversational and concise — you are being spoken to
    and your reply will be read aloud, so avoid bullet points, markdown,
    long lists, or any formatting. Just talk naturally.
    If you do not know something, say so simply.

# -----------------------------------------------------------------------------
# LLM Model
# -----------------------------------------------------------------------------
model:
  name: "gemma4:e4b"                    # ollama model name
  # Alternatives:
  # name: "gemma3:4b"                   # Previous generation, a little lighter
  # name: "gemma3:1b"                   # Faster, lighter, less capable
  host: "http://localhost:11434"        # Ollama server URL
  temperature: 0.7
  max_tokens: 500                       # Reply cap; a reply that hits it is trimmed to its last full sentence
  context_window: 4096                  # Reduce if you hit memory limits
  think: false                          # Gemma 4 reasons before answering by default; far too slow for voice on CPU
  keep_alive: -1                        # How long Ollama keeps the model loaded between questions (-1 = always, or e.g. "30m")
  timeout: 300                          # Seconds to wait for a reply (a 500-token answer takes ~150s on CPU)

# -----------------------------------------------------------------------------
# Speech-to-Text (faster-whisper)
# -----------------------------------------------------------------------------
stt:
  model: "small"                        # tiny | base | small | medium
  language: "en"
  device: "cpu"                         # cpu | cuda | auto
  compute_type: "int8"                  # int8 for CPU efficiency

# -----------------------------------------------------------------------------
# Wake Word (openWakeWord)
# -----------------------------------------------------------------------------
wake_word:
  enabled: true
  model: "hey_jarvis"                   # Built-in models: hey_jarvis, alexa, hey_mycroft
  threshold: 0.5                        # 0.0–1.0, lower = more sensitive
  # To use a custom wake word, see openWakeWord documentation

# -----------------------------------------------------------------------------
# Text-to-Speech (Piper)
# -----------------------------------------------------------------------------
tts:
  model: "models/piper/en_GB-alba-medium.onnx"
  config: "models/piper/en_GB-alba-medium.onnx.json"
  # Alternative voices — list with: python3 -m piper.download_voices
  # Download with: python3 -m piper.download_voices --download-dir models/piper <voice>
  # en_US-lessac-medium    (American, clear)
  # en_GB-alan-medium      (British male)

# -----------------------------------------------------------------------------
# Audio Hardware
# -----------------------------------------------------------------------------
audio:
  input_device: null                    # null = system default. Set to device index from setup.sh
  output_device: null                   # null = system default
  record_seconds: 8                     # Max recording length after wake word
  silence_threshold: 500                # Stop recording after this many ms of silence (used when Smart Turn is off)
  speech_threshold: 500                 # Mic RMS level counted as speech (raise in noisy rooms)

# -----------------------------------------------------------------------------
# Conversation (barge-in, end-of-turn detection, follow-ups)
# -----------------------------------------------------------------------------
conversation:
  barge_in: true                        # Talk over the assistant to stop it and ask something else.
                                        # Needs echo cancellation if the mic can hear the speaker (see README)
  barge_in_ms: 300                      # How long you must speak before it stops talking
  vad_threshold: 0.5                    # 0.0–1.0, Silero VAD score counted as speech
  smart_turn: true                      # Use the Smart Turn model to tell a pause from the end of a question
  smart_turn_model: "models/smart-turn/smart-turn-v3.2-cpu.onnx"
  pause_ms: 500                         # Pause length that makes Smart Turn check whether you've finished
  max_pause_ms: 2000                    # End the turn after this much silence, whatever Smart Turn says
  follow_up_seconds: 5                  # Keep listening this long after a reply, no wake word needed (0 = off)

# -----------------------------------------------------------------------------
# Behaviour
# -----------------------------------------------------------------------------
behaviour:
  startup_sound: true                   # Play a tone on boot to signal ready state
  conversation_memory: 6                # Number of previous exchanges to keep in context (0 = none)
  debug_mode: false                     # Set to true to print transcriptions and responses to stdout
